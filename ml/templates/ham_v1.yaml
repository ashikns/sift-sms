  - {id: otp_lyft, category: otp,
     text: "Your Lyft code is {d4}"}
  - {id: otp_doordash, category: otp,
     text: "Your DoorDash verification code is {d6}. Don't share this code with anyone."}
  - {id: otp_discord, category: otp,
