# Hand-written templates for modern (2024–2026, US-centric) legitimate SMS ("ham").
#
# Public SMS corpora are old (2012) or contain only spam, so modern legitimate traffic that *looks* like spam
# (OTP codes, carrier notices, bank alerts, opted-in promos, first-contact texts) is the scarcest data. These
# templates are expanded by smsml.sources.templates into training-only messages; splits are made by template id
# so no template appears in more than one split.
#
# Placeholders inside {braces}:
#   {slot}            a value from `slots` below (or from the template's own `slots` override)
#   {a|b|c}           an inline choice
#   {generator}       one of: d4 d5 d6 d8 code6_dash amount amount_big amount_round time date_md date_long
#                     weekday last4 order order_amz track_ups track_usps track_fedex flightno gate plate
#                     minutes zip pct phone tollfree
#   {n:A-B}           an integer in [A, B]
#   {name@var}        draw once per message and reuse for every @var reference (e.g. a WebOTP code shown twice)
# `weight` scales how many distinct expansions a template gets (default 1).
#
# All people, phone numbers (555-01xx), addresses and order numbers are fictional; domains are the real
# official domains of the named businesses.

version: 1

