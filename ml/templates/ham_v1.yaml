     text: "Your Google verification code is {d6@code}\n\n@accounts.google.com #{d6@code}"}
  - {id: otp_apple, category: otp, weight: 2,
     text: "Your Apple Account code is: {d6}. Don't share it with anyone."}
  - {id: otp_microsoft, category: otp,
     text: "Use {d6} as Microsoft account security code"}
  - {id: otp_amazon, category: otp, weight: 2,
     text: "{d6} is your Amazon OTP. Don't share it with anyone."}
  - {id: otp_meta, category: otp,
     text: "{d6@code} is your {Facebook|Instagram} code. Don't share it. #{d6@code}"}
  - {id: otp_whatsapp, category: otp,
     text: "Your WhatsApp code: {code6_dash}\n\nDon't share this code with others"}
  - {id: otp_paypal, category: otp,
     text: "PayPal: Your security code is {d6}. Your code expires in 10 minutes. Please don't reply."}
  - {id: otp_venmo, category: otp,
     text: "Venmo here! NEVER share this code via call/text. ONLY YOU should enter the code. BEWARE: If someone asks for the code, it's a scam. Code: {d6}"}
  - {id: otp_chase, category: otp,
