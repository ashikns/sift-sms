# Training/export pipeline configuration (scripts/s01..s11). Data-source settings live in data.yaml.
seed: 1234
model:
  id: sentence-transformers/all-MiniLM-L6-v2
  revision: 1110a243fdf4706b3f48f1d95db1a4f5529b4d41
  max_len: 128
  num_heads: 12
  hidden: 384
dedupe:
  num_perm: 128
  shingle: 5
  jaccard: 0.7
split:
  train: 0.70
  val: 0.15
  test: 0.15
  future_frac: 0.15          # newest timestamped smishing clusters -> "future" holdout
  max_per_cluster_train: 3
  max_spam_ratio: 3.0        # downsample spam clusters in train to at most 3 spam : 1 ham
finetune:
  lp_epochs: 3
  lp_lr: 1.0e-2
  ft_epochs: 3
  lr: 3.0e-5
  head_lr: 1.0e-3
  weight_decay: 0.01
  warmup: 0.06
  batch: 64
  clip: 1.0
  aug_spam_p: 0.5
  aug_ham_p: 0.2
  eval_every: 400
heads:
  lexical_C: 4.0
  embed_C: 1.0
calibrate:
  fpr:
    conservative: 0.001
    balanced: 0.005
    aggressive: 0.02
    warn: 0.05
knn:
  tau_spam: 0.80
  tau_ham: 0.90
personalization:
  # 1.0e6 freezes a block: only the sparse n-gram weights learn from marks. hash 4.0 = "light retraining", the
  # user's chosen trade-off (s08 --confirm: resent scams 65% caught, similar legit kept 75%, ~1.6 pt drift risk).
  priors: {embed: 1.0e6, meta: 1.0e6, hash: 4.0}
  weights: {spam: 1.0, ham: 1.0, cluster_cap: 2.0, cluster_cos: 0.8, max_examples: 5000}
  debounce_ms: 3000
