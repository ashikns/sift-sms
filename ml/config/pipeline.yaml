# Training/export pipeline configuration (scripts/s01..s11). Data-source settings live in data.yaml.
seed: 1234
model:
  id: sentence-transformers/all-MiniLM-L6-v2
  revision: 1110a243fdf4706b3f48f1d95db1a4f5529b4d41
  max_len: 128
  num_heads: 12
  hidden: 384
dedupe:
  num_perm: 128
  shingle: 5
  jaccard: 0.7
split:
  train: 0.70
  val: 0.15                  # the rest is test
  future_frac: 0.15          # newest timestamped smishing clusters -> "future" holdout
  max_per_cluster_train: 3
  max_spam_ratio: 3.0        # downsample spam clusters in train to at most 3 spam : 1 ham
  time_val: 0.20             # the inbox's oldest half splits by time: the newest 20% validate, the rest trains
finetune:
  lp_epochs: 3
  lp_lr: 1.0e-2
  ft_epochs: 3
  lr: 3.0e-5
  head_lr: 1.0e-3
  weight_decay: 0.01
  warmup: 0.06
  batch: 64
  clip: 1.0
  aug_spam_p: 0.5
  aug_ham_p: 0.2
  eval_every: 400
heads:
  lexical_C: 4.0
  embed_C: 1.0
  # The sender × content (SND) block's own L2 strength as an sklearn C, fit jointly with the lexical LR; s06 picks one
  # of these by PR-AUC on the val rows that have a sender.
  snd_C: [0.25, 1.0, 4.0]
  source_weight: {inbox: 20.0}
# Sources whose labels are too noisy to set thresholds or gates with (cube_sms77k's are model-assisted and about 3% of
# its "not spam" is promotional). They still train; s09 reports them separately.
noisy_sources: [cube_sms77k]
calibrate:
  fpr:
    conservative: 0.001
    balanced: 0.005
    aggressive: 0.02
    warn: 0.05
knn:
  tau_ham: 0.90
personalization:
  # "Light retraining", the user's chosen trade-off: the embedding and metadata blocks stay frozen and the sparse
  # n-gram weights learn from marks with hash prior 4.0 (s08 --confirm: resent scams 65% caught, similar legit kept
  # 75%, ~1.6 pt drift risk). The sender × content weights (snd) learn from marks too; they only move for the marked
  # message's own sender, so s08 also tries weaker priors for them.
  priors: {hash: 4.0, snd: 0.5}
  weights: {spam: 1.0, ham: 1.0, cluster_cap: 2.0, cluster_cos: 0.8}
  debounce_ms: 3000
